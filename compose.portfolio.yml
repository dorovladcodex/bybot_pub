services:
  api:
    build: .
    environment:
      APP_ENV: local
      BOT_MODE: PAPER
      EXECUTION_MODE: PAPER
      TEST_MODE: "true"
      MARKET_DATA_PROVIDER: MOCK
      NEWS_CLASSIFIER_MODE: mock
      NEWS_ENABLE_RSS: "false"
      AUTO_PAPER_EXECUTION: "false"
      BYBIT_ENABLE_TRADING: "false"
      BYBIT_DEMO_TRADING_ENABLED: "false"
      BYBIT_LIVE_TRADING_ENABLED: "false"
      PAPER_SYMBOL_COOLDOWN_SECONDS: "0"
      PAPER_GLOBAL_ENTRY_COOLDOWN_SECONDS: "0"
      DATABASE_URL: postgresql+psycopg://bybot:bybot@db:5432/bybot
    ports:
      - "127.0.0.1:8010:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2).close()"]
      interval: 2s
      timeout: 3s
      retries: 30

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: bybot
      POSTGRES_USER: bybot
      POSTGRES_PASSWORD: bybot
    volumes:
      - portfolio_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bybot -d bybot"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  portfolio_data:
