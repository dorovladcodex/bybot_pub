name: Safe tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q

  postgres-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: bybot_test
          POSTGRES_PASSWORD: bybot_test
          POSTGRES_DB: bybot_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bybot_test -d bybot_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      BYBOT_TEST_POSTGRES_URL: postgresql+psycopg://bybot_test:bybot_test@127.0.0.1:5432/bybot_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q tests/test_postgres_paper_execution.py
